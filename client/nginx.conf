server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # gzip cho text. Vite da minify nhung KHONG nen san (khong co .gz), nen neu
  # thieu block nay nginx tra ve JS nguyen 345KB thay vi 104KB.
  gzip              on;
  gzip_types        text/css application/javascript application/json image/svg+xml;
  gzip_min_length   1024;   # duoi nguong nay nen con ton CPU hon loi duoc
  gzip_vary         on;     # bao proxy/CDN cache rieng ban nen va ban thuong
  # Mac dinh cua nginx la level 1 — DA DO THAT tren bundle nay: 344KB → 120.7KB
  # o level 1, → 105.6KB o level 5 (vite bao 103.6KB vi no nen o level cao nhat).
  # Level 5 la diem gay: len 6–9 chi bot them vai KB ma ton CPU gap boi.
  gzip_comp_level   5;

  # ═══ /api PHAI dat TREN `location /` ═══
  # Vite dev proxy khong con o day; prod la nginx lam viec do. Giu NGUYEN path
  # (proxy_pass khong co dau / o cuoi → khong rewrite): axios goi /api/products
  # → http://api:3000/api/products, dung nhu route Express.
  #
  # Nho vay FE va API cung origin (localhost:80) → cookie httpOnly refreshToken
  # di ve binh thuong, khong dinh CORS/SameSite. Day cung la ly do client KHONG
  # can VITE_API_URL (lech Roadmap 7.1 buoc 2, xem Dockerfile).
  location /api {
    proxy_pass http://api:3000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Upload anh (multer) — mac dinh nginx chan o 1MB, anh dien thoai vuot ngay.
    client_max_body_size 10m;
  }

  # /health va /health/ready nam NGOAI /api (app.use("/health", ...) o server) nen
  # phai co block rieng, khong thi giam sat ngoai (UptimeRobot o Phase 8) chi thay
  # index.html tra ve 200 — luon xanh du API chet.
  location /health {
    proxy_pass http://api:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;

    # Khong bao gio cache ket qua health — cache 200 cu la giam sat mu.
    add_header Cache-Control "no-store";
  }

  # File co hash trong ten (index-chhzl_d_.js) → noi dung khong bao gio doi duoi
  # cung mot ten, cache duoc mot nam. Deploy ban moi sinh ten moi nen khong ai
  # bi ket ban cu.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: /products/abc la route CUA REACT, tren dia khong co file nao
  # ten vay. Thieu dong nay thi F5 giua app ra 404 cua nginx.
  #
  # index.html thi KHONG duoc cache: no la file duy nhat mang ten cac chunk moi.
  # Cache no = nguoi dung F5 van an ban cu, va con te hon — index.html cu tro
  # den chunk da bi xoa khoi server → trang trang.
  location / {
    try_files $uri $uri/ /index.html;

    add_header Cache-Control "no-cache";
  }
}
