# Toan bo stack production (Roadmap 7.1 buoc 3).
#
# Khac docker-compose.yml (dev) o cho: dev CHI chay ha tang (postgres+redis) con
# code chay tren may bang tsx; o day MOI THU nam trong container.
#
#   web       nginx — file tinh cua FE + proxy /api sang api. CUA DUY NHAT ra ngoai.
#   api       Express, KHONG mo port ra host
#   worker    CUNG image voi api, khac `command` — chay BullMQ, khong nhan HTTP
#   postgres  co volume rieng (pgdata-prod), KHONG dung chung volume voi dev
#   redis     co AOF de job trong queue song qua restart
#   migrate   one-off, nam trong profile "tools" → `up -d` KHONG chay no
#
# Bien moi truong doc tu file `.env` NGANG CAP file nay (xem .env.prod.example).
#
# Chay:  docker compose -f docker-compose.prod.yml up -d --build
# Deploy: ./deploy.sh  (co buoc migrate dung thu tu)

# ═══ `name` — KHONG duoc bo dong nay ═══
# Khong khai bao thi compose lay ten project theo TEN THU MUC. Ca hai file compose
# nam trong thu muc `shoplite` va deu co service `postgres`/`redis` → `up -d` ben dev
# THAY LUON container cua prod. Da dinh that: luc do `api-prod` van bao healthy (image
# chi tham `/health`, khong tham `/health/ready`) trong khi no dang noi chuyen voi
# Postgres cua DEV qua cung alias mang. Ten project rieng thi hai stack co mang rieng.
name: shoplite-prod

# ═══ Gioi han log — Roadmap 8.2 "Docker log day dia" ═══
# json-file mac dinh KHONG xoay vong: log lon vo han cho toi khi day dia, ma dia day
# thi Postgres chet chu khong phai container it quan trong. 10m x 5 = 50MB/container.
# Anchor YAML de doi mot cho la doi ca 5 service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    build:
      context: ./client
    image: shoplite-web:latest
    container_name: shoplite-web-prod
    restart: unless-stopped
    logging: *default-logging

    # Chi service nay mo port. HTTP_PORT de doi sang 8080 khi may da co gi o 80
    # (Phase 8 se dat certbot/nginx-proxy dung 80/443 o tren).
    ports:
      - "${HTTP_PORT:-80}:80"

    # `service_healthy` chu khong phai `service_started`: nginx PHAN GIAI ten `api`
    # LUC NAP CONFIG, ten chua ton tai la nginx chet ngay khi khoi dong ("host not
    # found in upstream").
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./server
    image: shoplite-api:latest
    container_name: shoplite-api-prod
    restart: unless-stopped
    logging: *default-logging

    # KHONG co `ports:` — API chi vao duoc qua nginx. Mo 3000 ra host la mo duong di
    # tat, bo qua moi thu nginx dang lam. Debug thi `compose exec api sh`.

    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Ghi de host: trong mang compose, DB/Redis mang ten SERVICE chu khong phai
      # localhost. De .env cua may dev lot vao day la "ECONNREFUSED 127.0.0.1:5432".
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Dung LAI image cua api (khong build lan hai): cung code, cung deps.
    build:
      context: ./server
    image: shoplite-api:latest
    container_name: shoplite-worker-prod
    restart: unless-stopped
    logging: *default-logging

    command: ["node", "dist/worker.js"]

    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379

    # ═══ Healthcheck rieng — PHAI ghi de, va PHAI la mot phep kiem that ═══
    # Worker dung CHUNG image voi api, ma image do co san HEALTHCHECK
    # (wget localhost:3000/health). Khong khai bao gi = ke thua cai do → worker khong
    # mo port nen unhealthy vinh vien du chay dung.
    #
    # Ban va dau tien la `disable: true`, va no DOI MOT LOI LAY MOT LOI KHAC:
    # `up -d --wait` TU CHOI ca stack neu co container khong khai healthcheck
    # ("has no healthcheck configured"). Docker Desktop o may dev cho qua, Codespaces
    # thi khong — codespace dau tien deploy.sh chet ngang, seed khong chay, demo mo ra
    # la mot cua hang trong.
    #
    # Nhip tim vao Redis (src/lib/worker-heartbeat.ts) chung minh worker con song VA
    # con noi duoc Redis — ma noi duoc Redis la toan bo cong viec cua no. Da BAC phep
    # kiem "PID 1 con chay khong": container con chay thi no gan nhu luon dung.
    healthcheck:
      test: ["CMD", "node", "dist/worker-healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Worker ghi nhip dau tien ngay khi Redis noi duoc, nhung van cho no thoi
      # gian nap Prisma Client + dang ky lich BullMQ.
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── one-off: prisma migrate deploy ────────────────────────────────────────
  # `profiles` khien service nay BI BO QUA boi `up -d`. Goi tay:
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  #
  # Dung stage `migrator` vi image `api` co y KHONG mang prisma CLI (nho hon 148MB,
  # va khong dua cong cu sua schema vao container dang phuc vu HTTP) — nen lenh o
  # Roadmap 7.1 buoc 3 (`run --rm api npx prisma migrate deploy`) KHONG chay duoc.
  migrate:
    build:
      context: ./server
      target: migrator
    image: shoplite-migrator:latest
    profiles: ["tools"]

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: shoplite-postgres-prod
    restart: unless-stopped
    logging: *default-logging

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # KHONG mo 5432 ra host. Muon chay psql: `compose exec postgres psql -U ...`.
    # Postgres mo ra Internet voi mat khau yeu la cach bi chiem may nhanh nhat.

    volumes:
      - pgdata-prod:/var/lib/postgresql/data

    healthcheck:
      # -U ${POSTGRES_USER}: pg_isready khong co user dung se bao "no attribute"
      # roi bao healthy sai.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      # initdb lan dau mat ~5–10s; start_period cho no thoi gian do ma khong tinh la
      # retry that bai.
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: shoplite-redis-prod
    restart: unless-stopped
    logging: *default-logging

    # Job BullMQ nam trong Redis, ma mac dinh redis chi snapshot dinh ky → restart
    # giua luc dong job la mat job (don da tao nhung email khong bao gio gui). AOF ghi
    # tung lenh nen mat toi da 1 giay.
    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redisdata-prod:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  # Hau to -prod: KHONG dung chung volume voi compose dev, khong thi `down -v` ben dev
  # xoa luon DB prod.
  #
  # `name:` dat TAY vi ten mac dinh la <project>_<volume>, ma project lay theo TEN THU
  # MUC — clone repo sang thu muc khac la ra bo volume khac, DB khoi dong rong tron
  # trong khi du lieu cu van nam day duoi mot cai ten khac.
  pgdata-prod:
    name: shoplite_pgdata-prod
  redisdata-prod:
    name: shoplite_redisdata-prod
